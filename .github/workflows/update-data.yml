name: Update Stryktipset data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Körningstyp
        required: true
        default: full
        type: choice
        options: [full, claim, results, clear-challengers, migrate-challengers]
  schedule:
    # GitHub cron använder UTC. Två kandidater per lokal tid täcker svensk
    # sommar-/vintertid. Jobben är idempotenta, så båda kandidaterna får köra:
    # GitHubs schemalagda jobb kan starta långt efter den angivna minuten.
    - cron: '0 2,3 * * 5'
    - cron: '0 10,11 * * 6'
    - cron: '0 23 * * 0'
    - cron: '0 0 * * 1'
    # Försök varje timme 08–12 svensk tid. När dokumentet finns blir resten idempotent.
    - cron: '0 6,7,8,9,10,11 * * 4'

permissions:
  contents: read

concurrency:
  group: update-stryktipset-data
  cancel-in-progress: false

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.time.outputs.should-run }}
      mode: ${{ steps.time.outputs.mode }}
    steps:
      - id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "mode=${MODE_INPUT:-full}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 23 * * 0" ] || [ "${{ github.event.schedule }}" = "0 0 * * 1" ]; then
            echo "mode=results" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6,7,8,9,10,11 * * 4" ]; then
            echo "mode=claim" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: schedule-check
    if: needs.schedule-check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir functions test
      - run: pnpm --dir functions build
      - name: Deploy Firestore rules
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm exec firebase deploy --only firestore:rules --project stryktipset-46f61
      - name: Scrape, validate and publish
        if: needs.schedule-check.outputs.mode == 'full'
        run: node functions/lib/run-update.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SCRAPER_MODEL: ${{ vars.OPENAI_SCRAPER_MODEL }}
      - name: Settle results and update expert statistics
        if: needs.schedule-check.outputs.mode == 'results'
        run: node functions/lib/run-results.js
      - name: Prepare claimable round
        if: needs.schedule-check.outputs.mode == 'claim'
        run: node functions/lib/run-claims.js
      - name: Clear current challenger tips
        if: needs.schedule-check.outputs.mode == 'clear-challengers'
        run: node functions/lib/run-clear-challengers.js
      - name: Migrate current challenger tips to private storage
        if: needs.schedule-check.outputs.mode == 'migrate-challengers'
        run: node functions/lib/run-migrate-challengers.js
