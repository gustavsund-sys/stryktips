name: Update Stryktipset data

on:
  workflow_dispatch:
  schedule:
    # GitHub cron använder UTC. Två kandidater täcker svensk sommar-/vintertid;
    # jobbets första steg släpper bara igenom exakt 04:00 Europe/Stockholm.
    - cron: '0 2,3 * * 5'

permissions:
  contents: read

concurrency:
  group: update-stryktipset-data
  cancel-in-progress: false

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.time.outputs.should-run }}
    steps:
      - id: time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=Europe/Stockholm date +'%u %H:%M')" = "5 04:00" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: schedule-check
    if: needs.schedule-check.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir functions test
      - run: pnpm --dir functions build
      - name: Deploy Firestore rules
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm exec firebase deploy --only firestore:rules --project stryktipset-46f61
      - name: Scrape, validate and publish
        run: node functions/lib/run-update.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SCRAPER_MODEL: ${{ vars.OPENAI_SCRAPER_MODEL }}
