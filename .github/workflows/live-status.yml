name: Update live results

on:
  workflow_dispatch:
  schedule:
    # Skapa/uppdatera nedräkningen när den nya kupongen släpps på torsdagen.
    - cron: '0 6-11 * * 4'
    # Var femte minut på lördag eftermiddag/kväll. Det breda UTC-fönstret
    # täcker både svensk sommar- och vintertid.
    - cron: '*/5 12-23 * * 6'
    - cron: '*/5 0-1 * * 0'

permissions:
  contents: read

concurrency:
  group: stryktipset-live-status
  cancel-in-progress: true

jobs:
  update-live:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Test live parser
        run: node --test scripts/live-status.test.mjs
      - name: Fetch and publish live status
        run: node scripts/update-live-status.mjs
        env:
          FIREBASE_PROJECT_ID: stryktipset-46f61
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
